  <div class="bg-white rounded-xl shadow p-4 mb-6">
    <div class="flex flex-wrap gap-3 items-center">
      <div class="flex-1 min-w-48">
        <input type="text" id="search" placeholder="色名・HEXで検索..." class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-300 focus:outline-none" aria-label="色名またはHEX値で検索">
      </div>
      <div>
        <select id="hue-filter" class="border rounded-lg px-3 py-2 text-sm" aria-label="色相フィルター">
          <option value="">すべての色相</option>
          <option value="red">赤系</option>
          <option value="orange">橙系</option>
          <option value="yellow">黄系</option>
          <option value="green">緑系</option>
          <option value="blue">青系</option>
          <option value="purple">紫系</option>
          <option value="pink">桃系</option>
          <option value="brown">茶系</option>
          <option value="gray">灰系</option>
          <option value="white">白系</option>
          <option value="black">黒系</option>
        </select>
      </div>
      <div class="text-sm text-gray-500"><span id="count">0</span> 色</div>
      <button id="fav-toggle" class="text-sm bg-yellow-100 hover:bg-yellow-200 text-yellow-700 px-3 py-2 rounded-lg" aria-label="お気に入りのみ表示">⭐ お気に入り</button>
    </div>
  </div>

  <!-- 選択色詳細 -->
  <div id="selected-panel" class="hidden bg-white rounded-xl shadow p-5 mb-6">
    <div class="flex items-start gap-6">
      <div id="sel-swatch" class="w-24 h-24 rounded-xl flex-shrink-0 border border-gray-200" role="img"></div>
      <div class="flex-1">
        <div class="flex items-center gap-3 mb-1">
          <h2 id="sel-name" class="text-2xl font-bold text-gray-800"></h2>
          <span id="sel-kana" class="text-gray-400 text-sm"></span>
          <button id="sel-fav" class="text-xl" aria-label="お気に入り切り替え">⭐</button>
        </div>
        <div class="grid grid-cols-3 gap-3 text-sm">
          <div class="bg-gray-50 rounded p-2"><div class="text-gray-400 text-xs mb-1">HEX</div><code id="sel-hex" class="font-mono text-indigo-700 cursor-pointer hover:underline" title="クリックでコピー"></code></div>
          <div class="bg-gray-50 rounded p-2"><div class="text-gray-400 text-xs mb-1">RGB</div><code id="sel-rgb" class="font-mono text-gray-700"></code></div>
          <div class="bg-gray-50 rounded p-2"><div class="text-gray-400 text-xs mb-1">HSL</div><code id="sel-hsl" class="font-mono text-gray-700"></code></div>
        </div>
        <div class="mt-2 text-xs text-gray-500" id="sel-desc"></div>

    </div>

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return{r,g,b};
}

function hexToHsl(hex){
  let {r,g,b}=hexToRgb(hex);
  r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h,s,l=(max+min)/2;
  if(max===min){h=s=0;}
  else{
    const d=max-min;
    s=l>0.5?d/(2-max-min):d/(max+min);
    switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}
    h/=6;
  }
  return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};
}

function getContrastColor(hex){
  const {r,g,b}=hexToRgb(hex);
  const luminance=(0.299*r+0.587*g+0.114*b)/255;
  return luminance>0.5?'#1a1a1a':'#ffffff';
}

let selectedColor=null;

function renderGrid(colors){
  const grid=document.getElementById('color-grid');
  const noResults=document.getElementById('no-results');
  document.getElementById('count').textContent=colors.length;

  if(colors.length===0){grid.innerHTML='';noResults.classList.remove('hidden');return;}
  noResults.classList.add('hidden');

  grid.innerHTML=colors.map(c=>{
    const isFav=favorites.includes(c.hex);
    const contrast=getContrastColor(c.hex);
    return`<div class="color-card rounded-xl overflow-hidden cursor-pointer hover:scale-105 transition-transform shadow-sm hover:shadow-md" data-hex="${c.hex}" role="button" tabindex="0" aria-label="${c.name}（${c.kana}）">
      <div class="h-16 flex items-end justify-between p-1.5" style="background-color:${c.hex}">
        ${isFav?`<span class="text-xs" style="color:${contrast}">⭐</span>`:'<span></span>'}
        <span class="text-xs font-mono opacity-80" style="color:${contrast}">${c.hex}</span>
      </div>
      <div class="p-2 bg-white">
        <div class="text-xs font-semibold text-gray-800 truncate">${c.name}</div>
        <div class="text-xs text-gray-400 truncate">${c.kana}</div>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.color-card').forEach(card=>{
    const handler=()=>selectColor(card.dataset.hex);
    card.addEventListener('click',handler);
    card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')handler();});
  });
}

function selectColor(hex){
  const c=COLORS.find(x=>x.hex===hex);
  if(!c)return;
  selectedColor=c;
  const panel=document.getElementById('selected-panel');
  panel.classList.remove('hidden');
  document.getElementById('sel-swatch').style.backgroundColor=hex;
  document.getElementById('sel-swatch').setAttribute('aria-label',c.name+'の色見本');
  document.getElementById('sel-name').textContent=c.name;
  document.getElementById('sel-kana').textContent=c.kana;
  const {r,g,b}=hexToRgb(hex);
  const {h,s,l}=hexToHsl(hex);
  document.getElementById('sel-hex').textContent=hex;
  document.getElementById('sel-rgb').textContent=`rgb(${r}, ${g}, ${b})`;
  document.getElementById('sel-hsl').textContent=`hsl(${h}, ${s}%, ${l}%)`;
  document.getElementById('sel-desc').textContent=c.desc||'';
  document.getElementById('sel-fav').textContent=favorites.includes(hex)?'⭐':'☆';
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

document.getElementById('sel-hex').addEventListener('click',()=>{
  if(selectedColor)navigator.clipboard.writeText(selectedColor.hex).then(()=>{const el=document.getElementById('sel-hex');el.textContent='Copied!';setTimeout(()=>el.textContent=selectedColor.hex,1200);});
});

document.getElementById('sel-fav').addEventListener('click',()=>{
  if(!selectedColor)return;
  const hex=selectedColor.hex;
  if(favorites.includes(hex))favorites=favorites.filter(f=>f!==hex);
  else favorites.push(hex);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(favorites));
  document.getElementById('sel-fav').textContent=favorites.includes(hex)?'⭐':'☆';
  filterAndRender();
});

function filterAndRender(){
  const q=document.getElementById('search').value.toLowerCase();
  const hue=document.getElementById('hue-filter').value;
  let filtered=COLORS;
  if(q)filtered=filtered.filter(c=>c.name.includes(q)||c.kana.includes(q)||c.hex.toLowerCase().includes(q));
  if(hue)filtered=filtered.filter(c=>c.hue===hue);
  if(showFavOnly)filtered=filtered.filter(c=>favorites.includes(c.hex));
  renderGrid(filtered);
}

document.getElementById('search').addEventListener('input',filterAndRender);
document.getElementById('hue-filter').addEventListener('change',filterAndRender);
document.getElementById('fav-toggle').addEventListener('click',()=>{
  showFavOnly=!showFavOnly;
  document.getElementById('fav-toggle').classList.toggle('bg-yellow-300',showFavOnly);
  filterAndRender();
});

filterAndRender();
</script>
</body>
</html>
